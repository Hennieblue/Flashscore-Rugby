<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d35"><title>Flashscore Rugby Today</title>
<style>:root{font-family:Arial,Helvetica,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#06172b;color:#fff}header{padding:1.2rem 1rem;background:#092b4c;border-bottom:4px solid #ec3157}header div,main{width:min(100%,44rem);margin:auto}h1{margin:0;font-size:2rem}.date{margin:.5rem 0 0;color:#d8e9f7;font-size:1.05rem}main{padding:1rem}.language{display:flex;gap:.6rem;margin-bottom:1rem}.language button{flex:1;background:#143f63;color:#fff}.language button[aria-pressed=true]{background:#ec3157;color:#fff;border-color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:.7rem;margin-bottom:1rem}.updated{margin:0;color:#c6d8e8}button{min-height:3.4rem;border:2px solid #fff;border-radius:.7rem;font:inherit;font-size:1.08rem;font-weight:700;cursor:pointer}.refresh{padding:.7rem 1rem;background:#ec3157;color:#fff}.match{width:100%;padding:1rem;text-align:left;background:#0d3b64;color:#fff}.match:focus,.refresh:focus,a:focus{outline:4px solid #71d5ff;outline-offset:3px}.score{display:block;margin-top:.55rem;color:#ffe06b;font-size:1.4rem}#matches{display:grid;gap:.85rem}.details{margin:-.45rem 0 .35rem;padding:1rem;border:2px solid #5f89ab;border-radius:.7rem;background:#0a2948;line-height:1.6}.details p{margin:.2rem 0}.details h2{font-size:1.18rem}.details li{margin:.35rem 0}.details a{color:#8ee6ff;font-weight:700}.notice{padding:1.1rem;border:2px solid #7193ad;border-radius:.7rem;background:#0a2948;line-height:1.5}.error{border-color:#ff9b9b}</style></head>
<body><header><div><h1 id="title">Flashscore Rugby Today</h1><p id="date" class="date"></p></div></header><main><div class="language" role="group" aria-label="Language / Taal"><button id="en" type="button">English</button><button id="af" type="button">Afrikaans</button></div><div class="toolbar"><p id="updated" class="updated"></p><button id="refresh" class="refresh" type="button">Refresh</button></div><div id="message" aria-live="polite"></div><div id="matches"></div></main>
<script>let data={updated:"",matches:[]},openKey="",language=localStorage.getItem("flashscore-language")||"en";const words={en:{title:"Flashscore Rugby Today",updated:"Data updated",refresh:"Refresh",against:"versus",time:"Time",status:"Status",score:"Score",events:"Commentary / incidents",none:"No rugby matches are scheduled today.",noevents:"No commentary is available yet.",open:"Open match on Flashscore",error:"Flashscore data could not be loaded. Press Refresh to try again.",upcoming:"Upcoming",finished:"Finished"},af:{title:"Flashscore Rugby Vandag",updated:"Data opgedateer",refresh:"Verfris",against:"teen",time:"Tyd",status:"Status",score:"Telling",events:"Kommentaar / insidente",none:"Geen rugbywedstryde is vandag geskeduleer nie.",noevents:"Nog geen kommentaar beskikbaar nie.",open:"Maak wedstryd op Flashscore oop",error:"Flashscore-data kon nie gelaai word nie. Druk Verfris om weer te probeer.",upcoming:"Komende",finished:"Voltyds"}};const list=document.querySelector("#matches"),message=document.querySelector("#message");function esc(v){return String(v||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function localStatus(v,w){return v==="FINISHED"?w.finished:v==="UPCOMING"?w.upcoming:v||w.upcoming}function key(m){return m.home+"|"+m.away+"|"+m.time}function draw(){const w=words[language];document.documentElement.lang=language;document.querySelector("#title").textContent=w.title;document.querySelector("#date").textContent=new Intl.DateTimeFormat(language==="af"?"af-ZA":"en-ZA",{timeZone:"Africa/Johannesburg",weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());document.querySelector("#updated").textContent=w.updated+": "+(data.updated||"-");document.querySelector("#refresh").textContent=w.refresh;for(const l of ["en","af"])document.querySelector("#"+l).setAttribute("aria-pressed",String(language===l));list.replaceChildren();message.replaceChildren();if(!data.matches.length){message.innerHTML='<p class="notice">'+w.none+'</p>';return}data.matches.forEach((m,i)=>{const k=key(m),b=document.createElement("button");b.type="button";b.className="match";b.setAttribute("aria-expanded",String(openKey===k));b.setAttribute("aria-controls","details-"+i);b.innerHTML=esc(m.home)+" "+w.against+" "+esc(m.away)+'<span class="score">'+localStatus(m.status,w)+": "+esc(m.score||"0 - 0")+"</span>";const d=document.createElement("section");d.id="details-"+i;d.className="details";d.hidden=openKey!==k;d.tabIndex=-1;const events=m.incidents&&m.incidents.length?"<ul>"+m.incidents.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"<p>"+w.noevents+"</p>";d.innerHTML="<p><strong>"+w.time+":</strong> "+esc(m.time||"-")+"</p><p><strong>"+w.status+":</strong> "+localStatus(m.status,w)+"</p><p><strong>"+w.score+":</strong> "+esc(m.score||"0 - 0")+"</p><h2>"+w.events+"</h2>"+events+'<p><a href="'+encodeURI(m.url)+'" target="_blank" rel="noopener">'+w.open+"</a></p>";b.addEventListener("click",()=>{openKey=openKey===k?"":k;draw();if(openKey)document.querySelector("#details-"+i).focus()});list.append(b,d)})}async function load(){try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error();data=await r.json();draw()}catch(e){message.innerHTML='<p class="notice error">'+words[language].error+'</p>'}}document.querySelector("#refresh").addEventListener("click",load);for(const l of ["en","af"])document.querySelector("#"+l).addEventListener("click",()=>{language=l;localStorage.setItem("flashscore-language",l);draw()});draw();load();setInterval(load,30000);</script></body></html>
